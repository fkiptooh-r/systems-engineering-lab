# Phase 1 workspace: every exercise and project in this folder shares one
# Cargo.lock and one target/ directory, and is checked by one command.
# `cargo new <dir>` run inside this folder adds the new crate to `members`.
[workspace]
resolver = "3"
members = ["borrowing/borrow-rules", "borrowing/returning-references", "error-handling/sum-numbers","ownership/move-vs-copy", "ownership/string-vs-str"]
